- name : create ec2 instance and r53 records
  host : local
  connections: local
  vars:
    instances: ["mangodb","redis","mysql", "rabbitmq"]
    action: create
    domain_name:yuga92.store
    ami_id: ami-0055977a6e882824f4
  tasks:
    - name : create ec2 instance
      amazon.aws.ec2_instance:
        name :"roboshop-{{item}}"
        image_id: "{{ami_id}}"
        instance_type: t3.micro
        security_groups:
          -roboshop-common
          -"roboshop-{{items}}"
          region: us-east-1

      loop: "{{instances}}"  